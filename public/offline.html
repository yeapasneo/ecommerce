<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're offline</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f1f5f9;color:#0f172a;text-align:center;padding:16px}
  .card{max-width:360px;background:#fff;border-radius:16px;padding:32px 24px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  img{width:64px;height:64px;border-radius:14px}
  h1{font-size:20px;margin:16px 0 8px}
  p{color:#475569;line-height:1.5;margin:0 0 20px}
  button{background:#0f3d5c;color:#fff;border:0;border-radius:8px;padding:10px 20px;font-size:15px;cursor:pointer}
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Check your internet connection and try again. আপনার ইন্টারনেট সংযোগ দেখে আবার চেষ্টা করুন।</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
