; /etc/supervisor/conf.d/technest-queue.conf
; Sends SMS / emails in the background. Reload: sudo supervisorctl reread && sudo supervisorctl update
[program:technest-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/technest/artisan queue:work --sleep=3 --tries=3 --max-time=3600
user=www-data
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/technest/storage/logs/queue.log
